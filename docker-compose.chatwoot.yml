# Chatwoot local infrastructure (WhatsApp inbox for Taty).
# Self-hosted, laptop-local only — ARCHITECTURE.md decision #1 (data sovereignty).
# See openspec/changes/chatwoot-hermes-taty-bridge/design.md for the full architecture.
#
# One-time setup and startup sequence: see apps/chatwoot-bridge/README.md.

name: contexia-chatwoot

services:
  postgres:
    # Plain postgres:15 fails Chatwoot's own db:chatwoot_prepare with
    # "extension vector is not available" — Chatwoot's schema requires pgvector
    # unconditionally (article_embeddings etc.), not just for a later feature as
    # originally assumed. Confirmed live: the currently running container already
    # has this extension installed (its data volume predates this fix landing in
    # git); this line just makes a future recreation match reality instead of
    # repeating the original failure.
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:?Set CHATWOOT_DB_PASSWORD in .env.chatwoot}
      POSTGRES_DB: chatwoot
    volumes:
      - chatwoot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chatwoot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chatwoot-web:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${CHATWOOT_PORT:-3020}:3000"
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: "${CHATWOOT_SECRET_KEY_BASE:?Set CHATWOOT_SECRET_KEY_BASE in .env.chatwoot (generate with openssl rand -hex 64)}"
      FRONTEND_URL: http://localhost:${CHATWOOT_PORT:-3020}
      DEFAULT_LOCALE: es
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:?Set CHATWOOT_DB_PASSWORD in .env.chatwoot}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://redis:6379
      RAILS_LOG_TO_STDOUT: "true"
      ENABLE_ACCOUNT_SIGNUP: "false"
      # whatsapp-durable-inbox: Chatwoot's SafeFetch/SSRF guard blocks webhook delivery to any
      # non-public IP by default, including host.docker.internal — that's how it reaches the
      # bridge process running on the host. This is Chatwoot's own documented escape hatch
      # (lib/safe_fetch.rb), not a workaround. Security trade-off, deliberately accepted here:
      # this instance is single-operator, local-only, and ENABLE_ACCOUNT_SIGNUP=false — the
      # residual risk this control exists for (an attacker-configured webhook URL used to probe
      # internal infra) requires dashboard access this instance doesn't expose to anyone but the
      # founder. Revisit if this account ever gains additional users or external exposure.
      SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"
    volumes:
      - chatwoot_storage:/app/storage
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  chatwoot-worker:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: "${CHATWOOT_SECRET_KEY_BASE:?Set CHATWOOT_SECRET_KEY_BASE in .env.chatwoot (generate with openssl rand -hex 64)}"
      FRONTEND_URL: http://localhost:${CHATWOOT_PORT:-3020}
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:?Set CHATWOOT_DB_PASSWORD in .env.chatwoot}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://redis:6379
      RAILS_LOG_TO_STDOUT: "true"
      # See chatwoot-web's comment above — this is the process that actually runs WebhookJob.
      SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"
    volumes:
      - chatwoot_storage:/app/storage
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

volumes:
  chatwoot_postgres:
    name: contexia_chatwoot_postgres
  chatwoot_redis:
    name: contexia_chatwoot_redis
  chatwoot_storage:
    name: contexia_chatwoot_storage

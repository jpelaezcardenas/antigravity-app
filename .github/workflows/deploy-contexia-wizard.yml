name: Deploy contexia-wizard

# Vercel's own Git integration for this project has a reproducible bug:
# a deploy triggered from the full monorepo (git push, or "redeploy" of one)
# fails to find routes-manifest.json even with Root Directory and Framework
# Preset correctly saved, while `vercel deploy` run locally from inside
# contexia-wizard/ works every time. This workflow replicates the local
# working path instead of relying on Vercel's native Git deploys.
# See: 2026-09-23 session notes / commit history around contexia-wizard/.vercelignore.

on:
  push:
    branches: [main]
    paths:
      - "contexia-wizard/**"
      - ".github/workflows/deploy-contexia-wizard.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Y8qqlb9oWshwU1XfUR40pQlQ
      VERCEL_PROJECT_ID: prj_jYoWGURXtKfZSw672SAt8JbFH92o
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --cwd contexia-wizard

      - name: Strip rootDirectory (avoid duplicating it with --cwd contexia-wizard)
        run: |
          jq 'if .settings then .settings |= del(.rootDirectory) else . end' \
            contexia-wizard/.vercel/project.json > /tmp/project.json.tmp
          mv /tmp/project.json.tmp contexia-wizard/.vercel/project.json
          cat contexia-wizard/.vercel/project.json

      - name: Locate pulled env file and copy it next to the app if needed
        run: |
          echo "Looking for .env.production.local ..."
          find . -maxdepth 3 -name ".env.production.local" -not -path "./node_modules/*" 2>/dev/null
          if [ -f ".env.production.local" ] && [ ! -f "contexia-wizard/.env.production.local" ]; then
            echo "Found at repo root, copying into contexia-wizard/"
            cp ".env.production.local" "contexia-wizard/.env.production.local"
          fi
          for f in .env.production.local contexia-wizard/.env.production.local; do
            [ -f "$f" ] || continue
            for k in NEXT_PUBLIC_SUPABASE_URL SUPABASE_URL; do
              line=$(grep "^${k}=" "$f")
              echo "$f :: $k present=$([ -n "$line" ] && echo yes || echo no) length=${#line}"
            done
          done

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN" --cwd contexia-wizard

      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --cwd contexia-wizard

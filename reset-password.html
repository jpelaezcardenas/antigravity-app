<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Contexia | Restablecer contraseña</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png?v=2026070207" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png?v=2026070207" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png?v=2026070207" />
  <!-- Completes the recovery link Supabase Auth emails from login.html's "Forgot password?" flow. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #020617;
      --field: #0f172a;
      --line: #334155;
      --teal: #2dd4bf;
      --cyan: #06b6d4;
      --blue: #2563eb;
      --lime: #22c55e;
      --yellow: #facc15;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #fca5a5;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px 14px;
      background:
        radial-gradient(circle at 24% 16%, rgba(45, 212, 191, 0.10), transparent 30%),
        radial-gradient(circle at 78% 84%, rgba(37, 99, 235, 0.12), transparent 30%),
        var(--navy);
      color: var(--text);
      font-family: Inter, sans-serif;
    }

    .shell { width: min(380px, 100%); display: grid; gap: 18px; }

    .logo-wrap { display: grid; place-items: center; min-height: 160px; }

    .logo-wrap img { width: min(280px, 80vw); height: auto; object-fit: contain; }

    .frame {
      padding: 1px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--lime) 0%, var(--yellow) 30%, var(--cyan) 68%, var(--blue) 100%);
      box-shadow: 0 0 42px rgba(34, 211, 238, 0.18);
    }

    .card {
      border-radius: 6px;
      border: 1px solid rgba(15, 23, 42, 0.95);
      background: rgba(11, 18, 32, 0.96);
      padding: 22px 20px;
      color: var(--text);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.40);
    }

    h1 { font-size: 15px; margin: 0 0 14px; color: var(--text); }

    form { display: grid; gap: 8px; }

    input {
      width: 100%;
      min-height: 38px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      outline: none;
      padding: 0 12px;
      font-family: Inter, sans-serif;
    }

    input::placeholder { color: #64748b; }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.12);
    }

    .primary {
      margin-top: 6px;
      border-radius: 4px;
      border: 0;
      min-height: 34px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      font-family: Inter, sans-serif;
      background: linear-gradient(135deg, #0891b2 0%, var(--cyan) 48%, var(--teal) 100%);
      color: var(--navy);
      box-shadow: 0 0 22px rgba(45, 212, 191, 0.22);
    }

    .primary:hover { filter: brightness(1.10); }

    .primary:disabled { cursor: wait; opacity: 0.65; }

    .msg {
      min-height: 18px;
      margin-top: 10px;
      color: var(--danger);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .links { margin-top: 14px; text-align: center; font-size: 12px; font-weight: 800; }

    .links a { color: #cbd5e1; text-decoration: none; }

    .links a:hover { color: white; text-decoration: underline; }
  </style>
</head>
<body>
  <main class="shell" aria-label="Restablecer contraseña Contexia">
    <div class="logo-wrap">
      <img src="/assets/img/logo_official_transparent.png" alt="Contexia" />
    </div>

    <section class="frame">
      <div class="card">
        <h1>Elige una nueva contraseña</h1>

        <form id="reset-form">
          <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="Nueva contraseña" aria-label="Nueva contraseña" />
          <input id="password-confirm" name="password-confirm" type="password" autocomplete="new-password" required placeholder="Confirmar contraseña" aria-label="Confirmar contraseña" />
          <button id="submit-button" class="primary" type="submit">Guardar contraseña</button>
        </form>

        <div class="links">
          <a href="/login.html">Volver a iniciar sesión</a>
        </div>

        <div id="message" class="msg" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      var SUPABASE_URL = "https://kpynymwghfwshvcvevxq.supabase.co";
      var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtweW55bXdnaGZ3c2h2Y3ZldnhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDAwMTksImV4cCI6MjA5NDYxNjAxOX0.skNy5PKg0oFIqZD-2GyMZFTVA68OxrS1rBKkFiWAhwA";
      var form = document.getElementById("reset-form");
      var message = document.getElementById("message");
      var button = document.getElementById("submit-button");
      var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      var recoveryReady = false;

      function setBusy(isBusy, label) {
        button.disabled = isBusy;
        button.textContent = label || "Guardar contraseña";
      }

      // Supabase JS v2 parses the recovery token from the URL fragment automatically and
      // fires PASSWORD_RECOVERY once the resulting session is established.
      client.auth.onAuthStateChange(function (event) {
        if (event === "PASSWORD_RECOVERY") recoveryReady = true;
      });

      client.auth.getSession().then(function (result) {
        var session = result && result.data && result.data.session;
        if (session) recoveryReady = true;
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        message.textContent = "";
        var password = document.getElementById("password").value;
        var passwordConfirm = document.getElementById("password-confirm").value;

        if (password !== passwordConfirm) {
          message.textContent = "Las contraseñas no coinciden.";
          return;
        }
        if (password.length < 8) {
          message.textContent = "La contraseña debe tener al menos 8 caracteres.";
          return;
        }
        if (!recoveryReady) {
          message.textContent = "Este enlace ya expiró o no es válido. Solicita uno nuevo desde el login.";
          return;
        }

        setBusy(true, "...");
        try {
          var result = await client.auth.updateUser({ password: password });
          if (result.error) throw result.error;
          message.style.color = "";
          message.textContent = "Contraseña actualizada. Redirigiendo al login...";
          setTimeout(function () {
            window.location.assign("/login.html");
          }, 1500);
        } catch (error) {
          message.textContent = error.message || "No fue posible actualizar la contraseña.";
          setBusy(false);
        }
      });
    })();
  </script>
</body>
</html>
